```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .form-container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .name-row {
            display: flex;
            gap: 15px;
        }

        .name-row .form-group {
            flex: 1;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .name-row {
                flex-direction: column;
                gap: 0;
            }

            body {
                padding: 15px;
            }

            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Contact Form</h2>

        <div class="name-row">

            <div class="form-group">
                <label>First Name</label>
                <input type="text" placeholder="Enter first name">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" placeholder="Enter last name">
            </div>

        </div>

        <div class="form-group">
            <label>Country</label>

            <select>
                <option>Select Country</option>
                <option>Pakistan</option>
                <option>India</option>
                <option>United States</option>
                <option>United Kingdom</option>
                <option>Canada</option>
            </select>
        </div>

        <div class="form-group">
            <label>Subject</label>

            <textarea placeholder="Write your subject..."></textarea>
        </div>

        <button class="submit-btn">Submit</button>

    </div>

</body>
</html>
```
